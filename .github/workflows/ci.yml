name: CI Marketplace Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Логинимся в Docker Hub с помощью наших Secrets
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Настраиваем Buildx для оптимальной сборки
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Сборка и Пуш Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-frontend:latest

      # 5. Сборка и Пуш Catalog Service
      - name: Build and Push Catalog Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/catalog-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-catalog-service:latest

      # 6. Сборка и Пуш Order Service
      - name: Build and Push Order Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/marketplace-order-service:latest