server {
    listen 80;
    server_name localhost;

    # 1. Отдача статики фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование запросов каталога на catalog-service
    location /api/v1/products {
        proxy_pass http://catalog-service:8001/api/v1/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Проксирование запросов заказов на order-service
    location /api/v1/orders {
        proxy_pass http://order-service:8002/api/v1/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}