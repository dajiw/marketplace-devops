{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketplace-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
      - path: /api/catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: {{ .Values.catalog.service.port }}
      - path: /api/orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: {{ .Values.order.service.port }}
{{- end }}